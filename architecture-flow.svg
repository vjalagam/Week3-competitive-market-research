<title id="title">Market Signal implemented architecture</title>
<desc id="desc">Streamlit starts discovery, then a queue loops through researcher and analyst. You.com supplies web and news evidence; OpenRouter extracts names and reports. An empty queue ends with cards and JSON download.</desc>
