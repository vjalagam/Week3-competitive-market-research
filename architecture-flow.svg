<text x="712" y="679" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#13233c" text-anchor="start">You.com Search</text>
<text x="664" y="713" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Web + news in parallel</text>
<text x="664" y="739" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Freshness: one month</text>
<rect x="90" y="820" width="460" height="116" rx="16" fill="#f3f6ff" stroke="#d6dfec" stroke-width="2"/>
<rect x="108" y="838" width="38" height="34" rx="9" fill="#315ad8" stroke="#315ad8" stroke-width="2"/>
<text x="127" y="863" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">4</text>
<text x="162" y="864" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#13233c" text-anchor="start">Analyze and validate</text>
<text x="114" y="898" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Validate JSON and filter sources</text>
<text x="114" y="924" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Append report to the snapshot</text>
<rect x="640" y="820" width="280" height="116" rx="16" fill="#effbf8" stroke="#d6dfec" stroke-width="2"/>
<rect x="658" y="838" width="38" height="34" rx="9" fill="#087c72" stroke="#087c72" stroke-width="2"/>
