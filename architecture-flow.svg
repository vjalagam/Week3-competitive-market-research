<text x="664" y="924" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Evidence to report JSON</text>
<rect x="270" y="1040" width="510" height="116" rx="16" fill="#fff8eb" stroke="#d6dfec" stroke-width="2"/>
<rect x="288" y="1058" width="38" height="34" rx="9" fill="#ae710b" stroke="#ae710b" stroke-width="2"/>
<text x="307" y="1083" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">5</text>
<text x="342" y="1084" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#13233c" text-anchor="start">Streamlit snapshot</text>
<text x="294" y="1118" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Report cards and JSON download</text>
