<text x="60" y="297" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#315ad8" text-anchor="start">LANGGRAPH WORKFLOW</text>
<text x="640" y="297" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087c72" text-anchor="start">EXTERNAL SERVICES</text>
<rect x="90" y="325" width="460" height="116" rx="16" fill="#f3f6ff" stroke="#d6dfec" stroke-width="2"/>
<rect x="108" y="343" width="38" height="34" rx="9" fill="#315ad8" stroke="#315ad8" stroke-width="2"/>
<text x="127" y="368" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">2</text>
<text x="162" y="369" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#13233c" text-anchor="start">Discover competitors</text>
<text x="114" y="403" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Extract up to three unique names</text>
<rect x="640" y="325" width="280" height="116" rx="16" fill="#effbf8" stroke="#d6dfec" stroke-width="2"/>
<rect x="658" y="343" width="38" height="34" rx="9" fill="#087c72" stroke="#087c72" stroke-width="2"/>
<text x="677" y="368" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">↗</text>
<text x="712" y="369" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#13233c" text-anchor="start">Discovery APIs</text>
<text x="664" y="403" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">You.com evidence</text>
<text x="664" y="429" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">OpenRouter names</text>
