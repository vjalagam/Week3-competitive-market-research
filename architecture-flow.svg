<text x="320" y="552" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#13233c" text-anchor="middle">competitors?</text>
<rect x="90" y="635" width="460" height="116" rx="16" fill="#f3f6ff" stroke="#d6dfec" stroke-width="2"/>
<rect x="108" y="653" width="38" height="34" rx="9" fill="#315ad8" stroke="#315ad8" stroke-width="2"/>
<text x="127" y="678" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="162" y="679" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#13233c" text-anchor="start">Research one competitor</text>
<text x="114" y="713" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Pop queue and collect evidence</text>
