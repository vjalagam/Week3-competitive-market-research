<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="title desc">
<title id="title">Market Signal research architecture</title>
<desc id="desc">Streamlit starts discovery. A LangGraph queue routes each competitor through research and analysis. Discovery uses You.com and OpenRouter, research runs web and news calls in parallel, and analysis validates OpenRouter JSON. Analysis loops to the queue. An empty queue ends with report cards and JSON download.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#53647c"/></marker></defs>
<rect width="1000" height="1220" fill="#ffffff"/>
<text x="40" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#315ad8" text-anchor="start">MARKET SIGNAL</text>
<text x="40" y="85" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#13233c" text-anchor="start">Competitive research workflow</text>
<rect x="90" y="118" width="460" height="116" rx="16" fill="#f3f6ff" stroke="#d6dfec" stroke-width="2"/>
<rect x="108" y="136" width="38" height="34" rx="9" fill="#315ad8" stroke="#315ad8" stroke-width="2"/>
<text x="127" y="161" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="162" y="162" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#13233c" text-anchor="start">Streamlit input</text>
<text x="114" y="196" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#53647c" text-anchor="start">Company name and API key checks</text>
